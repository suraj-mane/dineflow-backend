name: DineFlow Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Type Check + Tests ───────────────────────────────────────────────
  test:
    name: Type Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test
        env:
          JWT_SECRET:         test_secret_key_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_32_chars_minimum_here
          DB_HOST:            localhost
          DB_USER:            test
          DB_PASSWORD:        test
          DB_NAME:            test
          REDIS_HOST:         localhost
          NODE_ENV:           test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 2: Build Check ───────────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/server.js   && echo "✅ server.js exists"   || exit 1
          test -f dist/app.js      && echo "✅ app.js exists"      || exit 1

  # ── Job 3: Docker Build ───────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dineflow-backend:${{ github.sha }} .

      - name: Verify image built
        run: docker images dineflow-backend